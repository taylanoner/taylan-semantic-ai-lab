- id: dev-22
  question: What was total transaction volume attributed to the Mississauga West branch
    in 2025, based on customers' home branch?
  answerable: true
  ambiguity_tag: customer_vs_branch_location
  sql: "SELECT ROUND(SUM(ABS(t.amount)), 2) FROM fact_transaction t\n            JOIN\
    \ dim_account a ON t.account_id = a.account_id\n            JOIN dim_branch b\
    \ ON a.home_branch_id = b.branch_id\n            WHERE b.branch_name = 'Mississauga\
    \ West' AND a.is_internal = FALSE AND t.is_reversal = FALSE\n              AND\
    \ t.transaction_id NOT IN (\n                  SELECT reversal_of_transaction_id\
    \ FROM fact_transaction WHERE reversal_of_transaction_id IS NOT NULL\n       \
    \       )\n              AND date_part('year', t.transaction_date) = 2025"
  expected_result: 223804.08
  business_definition: Branch performance reporting attributes volume to the customer's
    home branch.
- id: dev-23
  question: How many transactions physically occurred at the Kanata branch in 2025,
    regardless of the customer's home branch?
  answerable: true
  ambiguity_tag: customer_vs_branch_location
  sql: "SELECT COUNT(*) FROM fact_transaction t\n            JOIN dim_account a ON\
    \ t.account_id = a.account_id\n            JOIN dim_branch b ON t.branch_id =\
    \ b.branch_id\n            WHERE b.branch_name = 'Kanata' AND a.is_internal =\
    \ FALSE\n              AND date_part('year', t.transaction_date) = 2025"
  expected_result: 631.0
  business_definition: Foot-traffic reporting attributes activity to the transaction's
    physical branch.
